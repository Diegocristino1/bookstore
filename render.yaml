services:
  - type: web
    name: bookstore-web
    env: docker
    plan: free
    dockerfilePath: Dockerfile
  buildCommand: 'pip install -r requirements.txt'
  # Use python -m gunicorn so the module runs in the same Python
  # environment that installed the packages (avoids pkg_resources issues)
  startCommand: 'python -m gunicorn bookstore.wsgi:application --bind 0.0.0.0:$PORT --workers 1'
    envVars:
      - key: SECRET_KEY
        value: ''
      - key: DEBUG
        value: 'False'
      - key: DB_HOST
        value: ''
      - key: DB_NAME
        value: ''
      - key: DB_USER
        value: ''
      - key: DB_PASSWORD
        value: ''
      - key: DB_PORT
        value: '5432'
