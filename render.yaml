databases:
  - name: bookstore-db
    plan: free

services:
  - type: web
    name: ebac-bookstore-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /admin/login/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com,bookstore-1-qmgv.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,https://bookstore-1-qmgv.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bookstore-db
          property: connectionString
